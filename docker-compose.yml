services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_OWNER_USER:-techforce_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-owner_password}
      POSTGRES_DB: ${DB_NAME:-techforce}
      APP_DB_USER: ${DB_APP_USER:-techforce_app}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:-app_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
